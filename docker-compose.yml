name: adikaraweb

services:
  app:
    build:
      context: ./src
      dockerfile: ../Dockerfile
    image: adikara-web:latest
    container_name: adikara-web
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 30s
    networks: [web]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  web:
    external: true
